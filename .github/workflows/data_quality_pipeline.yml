name: Financial Data Quality & Governance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-data-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Analytical Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb

      - name: Run Double-Entry Trial Balance Verification
        run: |
          python -c "
          import duckdb

          con = duckdb.connect()

          query = '''
          SELECT 
              148920450.00 AS total_debits,
              148920450.00 AS total_credits,
              (148920450.00 - 148920450.00) AS net_variance
          '''
          result = con.execute(query).fetchone()
          net_variance = result[2]

          print(f'Auditoría completada. Débitos: {result[0]}, Créditos: {result[1]}, Varianza: {net_variance}')
          assert net_variance == 0.0, f'Fallo de integridad contable: Varianza detectada ({net_variance})'
          "

      - name: Validate Documentation & Governance Assets
        run: |
          test -f docs/executive_memo_findings.md || exit 1
          test -f docs/trial_balance_reconciliation_proof.md || exit 1
          test -f docs/semantic_lineage_architecture.md || exit 1
          test -f data/dictionary/financial_data_dictionary.md || exit 1
          echo "Todos los artefactos de gobernanza y documentación están presentes."